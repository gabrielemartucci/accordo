<style>
/* =====================================================================
   ACCORDO · design system per iOS
   Principi Apple: chiarezza, deferenza, profondità. Materiali in vetro,
   liste raggruppate, titoli grandi, colori di sistema, un solo tinta.
   ===================================================================== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  /* sfondi (systemGroupedBackground, secondarySystemGroupedBackground) */
  --bg:#F2F2F7; --cell:#FFFFFF; --cell2:#F2F2F7; --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.20);
  /* testo (label, secondaryLabel, tertiaryLabel) */
  --l1:#000000; --l2:rgba(60,60,67,.62); --l3:rgba(60,60,67,.34); --sep:rgba(60,60,67,.18);
  /* tinta del brand: ottone */
  --tint:#F5B83D; --tint-ink:#1A1200; --tint-text:#946000; --tint-wash:rgba(245,184,61,.22); --tint-line:#D99A12;
  /* colori di sistema */
  --green:#34C759; --green-t:#1E7B34; --red:#FF3B30; --red-t:#C4170C; --orange:#FF9500;
  --glass:rgba(249,249,251,.74); --glass-line:rgba(0,0,0,.08); --glass-btn:rgba(255,255,255,.7);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --r-card:24px; --r-list:20px; --r-btn:26px;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --cell2:#2C2C2E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --l1:#FFFFFF; --l2:rgba(235,235,245,.62); --l3:rgba(235,235,245,.32); --sep:rgba(84,84,88,.55);
  --tint-text:#FFC85A; --tint-wash:rgba(245,184,61,.2);
  --green:#30D158; --green-t:#30D158; --red:#FF453A; --red-t:#FF6961; --orange:#FF9F0A;
  --glass:rgba(24,24,26,.72); --glass-line:rgba(255,255,255,.1); --glass-btn:rgba(60,60,64,.7);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --cell2:#2C2C2E; --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --l1:#FFFFFF; --l2:rgba(235,235,245,.62); --l3:rgba(235,235,245,.32); --sep:rgba(84,84,88,.55);
  --tint-text:#FFC85A; --tint-wash:rgba(245,184,61,.2);
  --green:#30D158; --green-t:#30D158; --red:#FF453A; --red-t:#FF6961; --orange:#FF9F0A;
  --glass:rgba(24,24,26,.72); --glass-line:rgba(255,255,255,.1); --glass-btn:rgba(60,60,64,.7);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.4); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--l1);font:17px/1.35 var(--font);letter-spacing:-.41px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-touch-callout:none}
button,input{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{min-height:100vh;min-height:100dvh;max-width:560px;margin:0 auto;position:relative}
.scr{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.scr.push{animation:pushIn .36s cubic-bezier(.32,.72,0,1)}
.scr.pop{animation:popIn .36s cubic-bezier(.32,.72,0,1)}
.scr.fade{animation:fadeIn .28s ease-out}
@keyframes pushIn{from{transform:translateX(36px);opacity:0}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:translateX(-36px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}

/* ---------- tipografia (Dynamic Type dove Safari lo consente) ---------- */
.lt{font:700 34px/1.12 var(--font);letter-spacing:.37px;margin:0;text-wrap:balance}
.ls{font:400 17px/1.35 var(--font);color:var(--l2);margin:8px 0 0;text-wrap:pretty}
.t-title2{font:700 22px/1.2 var(--font);letter-spacing:.35px;margin:0}
.t-body{font:400 17px/1.35 var(--font);letter-spacing:-.41px;margin:0}
.t-head{font:600 17px/1.3 var(--font);letter-spacing:-.41px}
.t-sub{font:400 15px/1.35 var(--font);letter-spacing:-.24px;color:var(--l2);margin:0}
.t-foot{font:400 13px/1.38 var(--font);letter-spacing:-.08px;color:var(--l2);margin:0}
.t-cap{font:500 12px/1.2 var(--font);color:var(--l2);letter-spacing:0;text-transform:uppercase;letter-spacing:.4px}
@supports (font:-apple-system-body){
  .t-body{font:-apple-system-body;letter-spacing:-.41px}
  .t-sub{font:-apple-system-subheadline;letter-spacing:-.24px}
  .t-foot{font:-apple-system-footnote;letter-spacing:-.08px}
  .t-head{font:-apple-system-headline;letter-spacing:-.41px}
}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.sec{color:var(--l2)} .ter{color:var(--l3)} .tx{color:var(--tint-text)}

/* ---------- barra di navigazione (vetro) ---------- */
.nav{position:sticky;top:0;z-index:20;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 12px 0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;transition:background .2s,box-shadow .2s}
.nav.compact{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);box-shadow:0 .5px 0 var(--glass-line)}
.nav .ttl{font:600 17px/1 var(--font);letter-spacing:-.41px;opacity:0;transition:opacity .2s;white-space:nowrap}
.nav.compact .ttl{opacity:1}
.nav .l{justify-self:start;display:flex}.nav .r{justify-self:end;display:flex;gap:8px}
.gbtn{min-width:44px;height:44px;border-radius:22px;border:0;display:inline-flex;align-items:center;justify-content:center;gap:2px;padding:0 12px;background:var(--glass-btn);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 0 0 .5px var(--glass-line),0 2px 8px rgba(0,0,0,.06);color:var(--l1);font:500 17px/1 var(--font);letter-spacing:-.41px}
.gbtn:active{transform:scale(.94)}
.gbtn.txt{color:var(--tint-text);font-weight:600}
.content{flex:1;padding:4px 16px 24px;display:flex;flex-direction:column;gap:24px}
.content.pad{padding-top:12px}
.head{padding:0 4px}
.steps{display:flex;gap:6px;justify-content:center;padding:0 0 4px}
.steps i{width:6px;height:6px;border-radius:3px;background:var(--fill2);transition:all .25s}
.steps i.on{background:var(--tint);width:20px}

/* ---------- dock (azioni in basso) ---------- */
.dock{position:sticky;bottom:0;z-index:15;padding:20px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;background:linear-gradient(to top,var(--bg) 62%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:var(--r-btn);border:0;background:var(--tint);color:var(--tint-ink);font:600 17px/1 var(--font);letter-spacing:-.41px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(245,184,61,.28);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.975);opacity:.9}
.btn.tinted{background:var(--tint-wash);color:var(--tint-text);box-shadow:none}
.btn.gray{background:var(--fill);color:var(--l1);box-shadow:none}
.btn.plain{background:none;color:var(--tint-text);box-shadow:none;height:44px;font-weight:500}
.btn.danger{background:rgba(255,59,48,.14);color:var(--red-t);box-shadow:none}
.btn.sm{width:auto;height:40px;padding:0 18px;font-size:15px;border-radius:20px}
.btn:disabled{opacity:.35;box-shadow:none}

/* ---------- liste raggruppate ---------- */
.list{background:var(--cell);border-radius:var(--r-list);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;background:none;border:0;text-align:left;position:relative;color:var(--l1)}
.row+.row::before,.row.sep::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.list.ic .row+.row::before{left:58px}
button.row:active{background:var(--fill)}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .rt b{font-weight:400}.row .rt small{font:400 15px/1.3 var(--font);color:var(--l2);letter-spacing:-.24px}
.row .val{color:var(--l2);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .chv{color:var(--l3);display:flex}
.tile{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--tint);color:var(--tint-ink)}
.tile.gray{background:var(--fill2);color:var(--l1)}
.tile.green{background:var(--green);color:#fff}.tile.red{background:var(--red);color:#fff}
.tile.lg{width:44px;height:44px;border-radius:12px}
.chk{color:var(--tint-text);display:flex}
.hdr{font:400 13px/1.2 var(--font);letter-spacing:-.08px;color:var(--l2);text-transform:uppercase;padding:0 16px 8px}
.ftr{font:400 13px/1.38 var(--font);letter-spacing:-.08px;color:var(--l2);padding:8px 16px 0}
.card{background:var(--cell);border-radius:var(--r-card);padding:20px}
.card.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(245,184,61,.26),transparent 60%),var(--cell)}
.card.tight{padding:16px}

/* ---------- controlli ---------- */
.segc{display:flex;background:var(--fill);border-radius:12px;padding:2px;gap:0}
.segc button{flex:1;border:0;background:none;height:32px;border-radius:10px;font:500 13px/1 var(--font);letter-spacing:-.08px;color:var(--l1);transition:background .2s,box-shadow .2s}
.segc button.on{background:var(--cell);box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .segc button.on{background:#636366}}
:root[data-theme="dark"] .segc button.on{background:#636366}
.ab{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:28px;padding:4px;gap:4px}
.ab button{border:0;background:none;border-radius:24px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--l2);transition:background .25s,color .25s,transform .25s}
.ab button b{font:600 17px/1 var(--font)}.ab button small{font:500 13px/1 var(--font);font-variant-numeric:tabular-nums}
.ab button.on{background:var(--cell);color:var(--l1);box-shadow:var(--shadow)}
.ab button.on.after{background:var(--tint);color:var(--tint-ink)}
.tgl{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;border:0;padding:0;flex:none;transition:background .2s}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on{background:var(--green)}.tgl.on::after{transform:translateX(20px)}
.input{width:100%;height:50px;border-radius:14px;border:0;background:var(--cell);padding:0 16px;font:400 17px/1 var(--font);color:var(--l1);outline:none}
.input::placeholder{color:var(--l3)}
.input:focus{box-shadow:0 0 0 2px var(--tint)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--fill2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;min-height:64px}
.stepper .l{display:flex;flex-direction:column;flex:1;min-width:0}
.stepper .v{font:600 28px/1 var(--round);min-width:76px;text-align:center;font-variant-numeric:tabular-nums}
.stepper .v small{font:500 15px var(--font);color:var(--l2);margin-left:2px}
.stepper button{width:44px;height:44px;border-radius:22px;border:0;background:var(--fill);display:grid;place-items:center;color:var(--l1)}
.stepper button:active{background:var(--fill2)}
.pill{display:inline-flex;align-items:center;gap:5px;font:600 13px/1 var(--font);padding:6px 11px 6px 9px;border-radius:999px;background:var(--fill);color:var(--l2);white-space:nowrap}
.pill.good{background:rgba(52,199,89,.16);color:var(--green-t)}.pill.bad{background:rgba(255,59,48,.14);color:var(--red-t)}.pill.ac{background:var(--tint-wash);color:var(--tint-text)}
.banner{display:flex;gap:12px;padding:14px 16px;border-radius:18px;background:var(--cell);font:400 15px/1.38 var(--font);letter-spacing:-.24px;color:var(--l2)}
.banner b{color:var(--l1);font-weight:600}.banner .ic{margin-top:1px}
.banner.bad{background:rgba(255,59,48,.12)}.banner.bad .ic{color:var(--red)}
.banner.good{background:rgba(52,199,89,.13)}.banner.good .ic{color:var(--green)}
.banner.info .ic{color:var(--tint-text)}
.feat{display:flex;gap:16px;align-items:flex-start}
.vsl.center{align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--l3);display:inline-block}
.sev{display:inline-flex;gap:4px}.sev i{width:8px;height:8px;border-radius:50%;background:var(--fill2)}.sev i.on{background:var(--tint)}

/* ---------- visuali ---------- */
.center{text-align:center;align-items:center}
.hero-ic{width:96px;height:96px;border-radius:26px;display:grid;place-items:center;background:var(--tint-wash);color:var(--tint-text);margin:0 auto}
.appicon{width:96px;height:96px;border-radius:22%;background:#0B0B0C;display:grid;place-items:center;color:#fff;--mkbg:#0B0B0C;box-shadow:0 0 0 .5px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.25);margin:0 auto}
.ringg{position:relative;display:grid;place-items:center}
.ringg svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringg .n{font:700 44px/1 var(--round);letter-spacing:-.04em}
.ringg.sm .n{font-size:30px}
.rg{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.spec{display:flex;align-items:flex-end;gap:3px;height:96px}
.spec i{flex:1;min-width:2px;height:8%;background:var(--l3);border-radius:3px;transition:height .1s linear,background .2s}
.spec.live i{background:var(--tint)}
.spec i.pk{background:var(--red)}
.gauge{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--fill2) 0 28%,rgba(52,199,89,.55) 28% 78%,rgba(255,149,0,.55) 78% 100%)}
.gauge i{position:absolute;top:50%;left:0;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:left .15s linear}
.bignum{font:700 64px/1 var(--round);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bignum small{font:500 20px var(--font);color:var(--l2);letter-spacing:-.4px;margin-left:4px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.big3>div{background:var(--cell);border-radius:20px;padding:16px 4px 14px;text-align:center}
.big3 .lab{font:500 12px/1 var(--font);color:var(--l2);letter-spacing:.2px;text-transform:uppercase}
.big3 b{display:block;font:700 34px/1.1 var(--round);letter-spacing:-.03em;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.big3 small{font:400 13px/1 var(--font);color:var(--l2)}
.fader{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
.fader .tr{position:relative;width:6px;height:150px;border-radius:3px;background:var(--fill2)}
.fader .tr::before{content:"";position:absolute;left:-8px;right:-8px;top:50%;height:1px;background:var(--l3)}
.fader .th{position:absolute;left:50%;width:30px;height:16px;margin-left:-15px;margin-top:-8px;border-radius:6px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.fader.on .th{background:var(--tint)}.fader.on .tr{background:var(--tint)}
.fader span{font:600 14px var(--round);font-variant-numeric:tabular-nums}.fader small{font-size:12px;color:var(--l2)}
.knobs{display:flex;justify-content:space-around;gap:8px}
.knob{display:flex;flex-direction:column;align-items:center;gap:10px}
.kn{width:84px;height:84px;border-radius:50%;background:var(--cell2);box-shadow:inset 0 0 0 .5px var(--sep),0 2px 8px rgba(0,0,0,.12);position:relative}
.kn i{position:absolute;left:50%;top:9px;width:5px;height:30px;margin-left:-2.5px;border-radius:3px;background:var(--l3);transform-origin:50% 33px;transform:rotate(var(--a))}
.knob.on .kn i{background:var(--tint)}
.knob b{font-size:15px;font-weight:600}.knob small{font-size:13px;color:var(--l2)}
.cw{position:relative;width:100%}
.cw svg{display:block;width:100%;height:auto;touch-action:pan-y;overflow:visible}
.cw .tt{position:absolute;top:0;pointer-events:none;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 0 0 .5px var(--glass-line),var(--shadow);border-radius:12px;padding:8px 10px;font-size:12px;min-width:140px;display:none;z-index:2}
.tt .tth{font:600 12px var(--font);color:var(--l2);margin-bottom:4px}
.tt .ttr{display:flex;align-items:center;gap:8px;line-height:1.7}.tt .ttr i{width:12px;height:3px;border-radius:2px;flex:none}
.tt .ttr b{font-variant-numeric:tabular-nums;min-width:56px}.tt .ttr span{color:var(--l2)}
.cw .ln{transition:opacity .35s,stroke-width .35s}
.cw[data-act="0"] .ln-1{opacity:.22}.cw[data-act="1"] .ln-0{opacity:.22}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font:400 13px var(--font);color:var(--l2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:0;border-top:3px solid;border-radius:2px;display:inline-block}.legend i.d{border-top-style:dashed}
.legend i.z{height:10px;width:16px;border:0;background:var(--green);opacity:.28;border-radius:3px}
.tw{max-height:50vh;overflow:auto;border-radius:var(--r-list);background:var(--cell)}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:40;animation:fadeOnly .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:41;background:var(--bg);border-radius:32px 32px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:86dvh;overflow:auto;animation:sheetIn .38s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 50px rgba(0,0,0,.25)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto 14px}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}

.path{display:flex;gap:6px;margin-top:18px}

<script>
'use strict';
/* =============================================================
   Accordo · prototipo funzionante per iPhone
   Tutto locale: nessun account, nessun server, nessun dato inviato.
   ============================================================= */
const FAST=/[?&]fast=1/.test(location.search);           // solo per collaudo: misure 5 volte più brevi
const $=(q,r=document)=>r.querySelector(q);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const nf=v=>(v>0.049?'+':v<-0.049?'−':'')+Math.abs(v).toFixed(1).replace('.',',');
const nf0=v=>(v>0?'+':v<0?'−':'')+Math.abs(Math.round(v));
const hz=f=>f>=1000?(+(f/1000).toFixed(2)).toString().replace('.',',')+' kHz':Math.round(f)+' Hz';
const kl=f=>f>=1000?(f/1000).toString().replace('.',',')+'k':String(f);
const dBp=p=>10*Math.log10(Math.max(p,1e-30));

/* ---------- icone (tratto 1,75, estremi arrotondati, stile SF Symbols) ---------- */
const IC={
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
 speaker:'<rect x="6" y="3" width="12" height="18" rx="2.5"/><circle cx="12" cy="15" r="3"/><circle cx="12" cy="7.5" r=".6"/>',

 guitar:'<path d="M14 10l6.5-6.5M17.5 3l3.5 3.5"/><path d="M11 9.5C8 8.5 5 10.5 5 13.5c0 1.8-2 2.3-2 4.2C3 20 5 21.5 7.3 21.5c3 0 5-2 5-5 0-1.2.7-1.8 1.7-3z"/>',
 keys:'<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 6v12M12 6v12M16 6v12"/>',
 person:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6"/>',
 group:'<circle cx="9" cy="9" r="3"/><circle cx="17" cy="10" r="2.5"/><path d="M3 19c0-3.5 2.5-5 6-5s6 1.5 6 5M15 15c3 0 6 1 6 4"/>',
 headset:'<path d="M5 14v-2a7 7 0 0 1 14 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/><path d="M19 20c0 1.5-2 2-5 2"/>',
 home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 book:'<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/>',
 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>', chev:'<path d="M9 5l7 7-7 7"/>', back:'<path d="M15 5l-7 7 7 7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
 alert:'<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.5v.3"/>',

 help:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.6 2.3c-.8.4-1.2 1-1.2 1.8M12 17v.3"/>',
 euro:'<path d="M17 7.2a6 6 0 1 0 0 9.6M5 10h8M5 14h8"/>', share:'<path d="M12 3v12M7 8l5-5 5 5M5 14v6h14v-6"/>',
 plug:'<path d="M9 3v5M15 3v5M7 8h10v3a5 5 0 0 1-10 0zM12 16v5"/>', cube:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',
 wave:'<path d="M3 12h2.5l2-6 3 12 3-9 2 3H21"/>', play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>', pause:'<path d="M9 5v14M15 5v14" stroke-width="3.4"/>',
 refresh:'<path d="M20 11a8 8 0 0 0-14-4M4 4v4h4M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/>',
 vol:'<path d="M4 9v6h4l5 4V5L8 9zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
 bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/>',
 trend:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',

};
const ic=(n,s=20,sw=1.75)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none">${IC[n]}</svg>`;
const MARK=(s=40)=>`<svg width="${s}" height="${s}" viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M10 42V22a14 14 0 0 1 28 0v20" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 31h16" stroke="#F5B83D" stroke-width="3.2" stroke-linecap="round"/><circle cx="27" cy="31" r="4.2" fill="#F5B83D" stroke="var(--mkbg,#000)" stroke-width="2.4"/></svg>`;

/* ---------- dati salvati ---------- */
const defQ=()=>({mixer:'',eqM:'peq',eqC:'peq4',sub:false,mon:'wedge',L:18,W:12,Hh:5,floor:'hard',walls:'plaster',ceil:'hard',ex:[],
  src:{drum:'ac',bass:1,egtr:1,agtr:0,keys:1,vox:2,choir:0,preacher:'headset',interp:false,jolly:true},obj:'parola',extmic:false,pts:3});
let DB={q:defQ(),qDone:false,hist:[],set:{theme:'auto',name:'',sala:'',days:[0],role:'new',text:'normal'},seen:false,cur:null,chk:{date:'',done:{}},rt:null,vol:{ref:null,lode:null,cal:null}};
try{const s=JSON.parse(localStorage.getItem('accordo.v2')||'null');if(s){DB=Object.assign(DB,s);DB.q=Object.assign(defQ(),DB.q);DB.q.src=Object.assign(defQ().src,DB.q.src)}}catch(e){}
const save=()=>{try{localStorage.setItem('accordo.v2',JSON.stringify(DB))}catch(e){}};
function applyTheme(){document.documentElement.dataset.text=DB.set.text||'normal';const t=DB.set.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ---------- bande e curva obiettivo ---------- */
const F=[63,80,100,125,160,200,250,315,400,500,630,800,1000,1250,1600,2000,2500,3150,4000,5000,6300,8000,10000,12500];
const gz=(f,f0,w)=>Math.exp(-.5*Math.pow(Math.log2(f/f0)/w,2));
function targetCurve(f,obj,ref,V){
  const sl=!V?1.6:V<800?1.4:V<2500?1.9:2.6;      // sale piccole: discesa più dolce; sale grandi: più marcata
  let t=f<=1000?0.4*Math.log2(1000/f):-sl*Math.log2(f/1000);
  const par=-1.5*gz(f,320,.6)+1.2*gz(f,3000,.7), mus=0.8*gz(f,100,.8);
  t+= obj==='parola'?par : obj==='musica'?mus : (par+mus)/2;
  if(ref==='musica'){ t+= f<100?-3*Math.log2(100/f): f>500?-3*Math.log2(f/500):0; }   // spettro medio tipico della musica (approssimato)
  return t;
}
/* ---------- stima del riverbero (Sabine, approssimata) ---------- */
function rt60(q){
  const V=q.L*q.W*q.Hh,Sf=q.L*q.W,Sw=2*(q.L+q.W)*q.Hh;
  const af={hard:.02,wood:.1,carpet:.3}[q.floor],aw={plaster:.03,drywall:.08,glass:.04}[q.walls],ac={hard:.03,acoustic:.55,beams:.12}[q.ceil];
  let A=Sf*af+Sf*ac+Sw*aw+Sf*.2;                                   // 0,2: sedie, persone, porte
  if(q.ex.includes('tende'))A+=.1*Sw; if(q.ex.includes('sedie'))A+=.15*Sf; if(q.ex.includes('pannelli'))A+=6; if(q.ex.includes('tappeti'))A+=.05*Sf;
  return {V,t:0.161*V/Math.max(A,1)};
}
const rtLabel=t=>rtRate(t);

/* =============================================================
   MOTORE AUDIO
   ============================================================= */
const Eng={
  ctx:null,stream:null,an:null,fbuf:null,tbuf:null,bb:null,gNoise:null,noiseSrc:null,settings:null,noiseOn:false,
  async ensureCtx(){
    if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('no-audio');this.ctx=new AC();
      this.ctx.onstatechange=()=>{if(this.ctx.state==='interrupted'||this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})}}
    if(this.ctx.state!=='running')await this.ctx.resume();
  },
  async openMic(){
    await this.ensureCtx();
    if(this.stream&&this.stream.getAudioTracks()[0]&&this.stream.getAudioTracks()[0].readyState==='live')return;
    if(!window.isSecureContext)throw new Error('insecure');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no-gum');
    this.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});
    const tr=this.stream.getAudioTracks()[0];this.settings=tr.getSettings?tr.getSettings():{};this.label=tr.label||'';
    if(this.ctx.state!=='running')await this.ctx.resume();
    const src=this.ctx.createMediaStreamSource(this.stream);
    this.an=this.ctx.createAnalyser();this.an.fftSize=16384;this.an.smoothingTimeConstant=0;this.an.minDecibels=-140;this.an.maxDecibels=0;
    const sink=this.ctx.createGain();sink.gain.value=0;src.connect(this.an);this.an.connect(sink);sink.connect(this.ctx.destination);
    this.fbuf=new Float32Array(this.an.frequencyBinCount);this.tbuf=new Float32Array(this.an.fftSize);
    this.binHz=this.ctx.sampleRate/this.an.fftSize;
    this.bb=F.map(fc=>{const lo=fc*Math.pow(2,-1/6),hi=fc*Math.pow(2,1/6);const a=Math.max(1,Math.ceil(lo/this.binHz)),b=Math.max(a,Math.ceil(hi/this.binHz)-1);return[a,b]});
  },
  ready(){return !!(this.an&&this.stream&&this.stream.getAudioTracks()[0].readyState==='live')},
  bandPow(){
    this.an.getFloatFrequencyData(this.fbuf);const o=new Float64Array(F.length);
    for(let i=0;i<F.length;i++){let s=0;const[a,b]=this.bb[i];for(let k=a;k<=b;k++)s+=Math.pow(10,this.fbuf[k]/10);o[i]=s}
    return o;
  },
  level(){
    this.an.getFloatTimeDomainData(this.tbuf);let s=0,pk=0;for(let i=0;i<this.tbuf.length;i++){const v=this.tbuf[i];s+=v*v;const a=Math.abs(v);if(a>pk)pk=a}
    return{rms:Math.sqrt(s/this.tbuf.length),peak:pk};
  },
  pinkBuf(){
    if(this._pink)return this._pink;const sr=this.ctx.sampleRate,n=sr*8,buf=this.ctx.createBuffer(1,n,sr),d=buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){const w=Math.random()*2-1;b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
    const f=Math.floor(sr*.05);for(let i=0;i<f;i++){const t=i/f;d[i]*=t;d[n-1-i]*=t}    // dissolvenze ai bordi del loop
    return this._pink=buf;
  },
  async startNoise(level){
    await this.ensureCtx();
    if(!this.noiseSrc){this.noiseSrc=this.ctx.createBufferSource();this.noiseSrc.buffer=this.pinkBuf();this.noiseSrc.loop=true;
      this.gNoise=this.ctx.createGain();this.gNoise.gain.value=0;this.noiseSrc.connect(this.gNoise);this.gNoise.connect(this.ctx.destination);this.noiseSrc.start()}
    this.setNoise(level);this.noiseOn=true;
  },
  setNoise(level){if(this.gNoise)this.gNoise.gain.setTargetAtTime(level*level*0.6,this.ctx.currentTime,.7)},
  stopNoise(){if(this.noiseSrc){try{this.gNoise.gain.setTargetAtTime(0,this.ctx.currentTime,.1);const s=this.noiseSrc;setTimeout(()=>{try{s.stop();s.disconnect()}catch(e){}},400)}catch(e){}this.noiseSrc=null;this.gNoise=null}this.noiseOn=false},
  closeMic(){if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null;this.an=null}}
};
/* misura: media di potenza per banda su `ms` millisecondi */
let CUR_MEAS=null;
function measure(ms,onTick){
  return new Promise(res=>{
    const acc={p:new Float64Array(F.length),n:0,peak:0,r2:0},t0=performance.now();
    const id=setInterval(()=>{
      if(!Eng.ready()){clearInterval(id);res(null);return}
      const bp=Eng.bandPow(),l=Eng.level();for(let i=0;i<F.length;i++)acc.p[i]+=bp[i];acc.n++;acc.peak=Math.max(acc.peak,l.peak);acc.r2+=l.rms*l.rms;
      const fr=(performance.now()-t0)/ms;if(onTick)onTick(bp,Math.min(1,fr),l);
      if(fr>=1){clearInterval(id);CUR_MEAS=null;res({pow:acc.p.map(v=>v/acc.n),n:acc.n,peak:acc.peak,rms:Math.sqrt(acc.r2/acc.n)})}
    },110);
    CUR_MEAS=()=>{clearInterval(id);res(null)};
  });
}

/* =============================================================
   ANALISI
   ============================================================= */
const MID=F.map((f,i)=>f>=200&&f<=4000?i:-1).filter(i=>i>=0);
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function bell(f,x){return x.g*Math.exp(-.5*Math.pow(Math.log(f/x.f)/(.294/x.q),2))}
function zoneName(f){return f<100?'Rimbombo':f<200?'Bassi gonfi':f<500?'Fango':f<1000?'Scatolato':f<2000?'Nasale':f<5000?'Durezza':f<10000?'Sibilanti':'Frizzante'}
const ZONE_TXT={Rimbombo:'Il basso rimbomba.','Bassi gonfi':'I bassi coprono il resto.',Fango:'La voce suona ovattata.',Scatolato:'Il suono è un po\' scatolato.',Nasale:'La voce suona nasale.',Durezza:'Le S e le chitarre pungono.',Sibilanti:'Le S sono taglienti.',Frizzante:'Gli alti sono troppo aperti.'};
function analyze(points,floor,opt){
  const n=F.length,valid=new Array(n).fill(true),Ls=[],lvs=[];
  points.forEach(pt=>{
    const L=new Array(n);
    for(let i=0;i<n;i++){const p0=pt.pow[i],nz=floor?floor.pow[i]:0;let p=p0;
      if(floor){if(p0>2*nz)p=p0-nz;if(p0<4*nz)valid[i]=false}                         // sotto 6 dB sopra il rumore: banda poco affidabile
      L[i]=dBp(p)}
    const m=mean(MID.map(i=>L[i]));lvs.push(m);Ls.push(L.map(v=>v-m));
  });
  const M=F.map((f,i)=>dBp(mean(Ls.map(L=>Math.pow(10,L[i]/10)))));
  const SPf=F.map((f,i)=>{const v=Ls.map(L=>L[i]);return Math.max(...v)-Math.min(...v)});
  const T=F.map(f=>targetCurve(f,opt.obj,opt.ref,opt.V));
  let D=M.map((v,i)=>v-T[i]);const c=mean(MID.map(i=>D[i]));D=D.map(v=>v-c);
  return{D,SP:SPf,T,valid,npts:points.length,cov:lvs.map(v=>v-lvs[0])};
}
function planEq(a,opt){
  const alta=opt.tier==='alta',maxCut=opt.ref==='musica'?3:alta?6:4,maxN=alta?4:3,fLo=alta?50:100,fHi=alta?12500:8000,thr=opt.ref==='musica'?4.5:3;
  const{D,SP,valid}=a,Ds=D.map((d,i)=>((D[i-1]??d)+2*d+(D[i+1]??d))/4);
  const cands=[],varia=[];
  for(let i=0;i<F.length;i++){
    if(F[i]<fLo||F[i]>fHi||!valid[i]||Ds[i]<thr)continue;
    if(Ds[i]<(Ds[i-1]??-99)||Ds[i]<(Ds[i+1]??-99))continue;
    if(SP[i]>9){varia.push({f:F[i],d:Ds[i]});continue}
    let w=1;for(let j=i-1;j>=0&&Ds[j]>=thr*.6;j--)w++;for(let j=i+1;j<F.length&&Ds[j]>=thr*.6;j++)w++;
    const N=Math.max(w,1)/3,Q=clamp(Math.sqrt(Math.pow(2,N))/(Math.pow(2,N)-1),.8,6);
    const g=-clamp(Math.round(.7*Ds[i]*2)/2,1,maxCut);
    cands.push({f:F[i],g,q:+Q.toFixed(1),d:Ds[i],name:zoneName(F[i])});
  }
  cands.sort((x,y)=>y.d-x.d);
  const picked=[];for(const c of cands){if(picked.length>=maxN)break;if(picked.some(p=>Math.abs(Math.log2(p.f/c.f))<.5))continue;picked.push(c)}
  picked.sort((x,y)=>x.f-y.f);
  const dips=[];for(let i=1;i<F.length-1;i++)if(valid[i]&&F[i]>=fLo&&F[i]<=fHi&&Ds[i]<=-5&&Ds[i]<=Ds[i-1]&&Ds[i]<=Ds[i+1])dips.push({f:F[i],d:Ds[i]});

   ANTEPRIMA SONORA (il momento "wow")
   Suona dal telefono nel mixer con la correzione già applicata.
   ============================================================= */
async function synthDemo(sr){
  const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext,oc=new OC(1,Math.round(sr*16),sr);
  const out=oc.createGain();out.gain.value=.55;out.connect(oc.destination);
  const noise=oc.createBuffer(1,Math.round(sr*.12),sr),nd=noise.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const chords=[[65.41,164.81,196,261.63,329.63],[61.74,146.83,196,246.94,392],[55,164.81,220,261.63,329.63],[43.65,174.61,220,261.63,349.23]];   // Do, Sol/Si, La-, Fa
  chords.forEach((ch,ci)=>{const t0=ci*4;
    const lp=oc.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;lp.Q.value=.5;
    const pg=oc.createGain();pg.gain.setValueAtTime(0,t0);pg.gain.linearRampToValueAtTime(.2,t0+.5);pg.gain.setValueAtTime(.2,t0+3.3);pg.gain.linearRampToValueAtTime(0,t0+4.05);lp.connect(pg);pg.connect(out);
    ch.slice(1).forEach(f=>[-8,8].forEach(d=>{const o=oc.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=d;const g=oc.createGain();g.gain.value=.07;o.connect(g);g.connect(lp);o.start(t0);o.stop(t0+4.1)}));
    const b=oc.createOscillator();b.type='sine';b.frequency.value=ch[0]*2;const bg=oc.createGain();bg.gain.setValueAtTime(0,t0);bg.gain.linearRampToValueAtTime(.34,t0+.05);bg.gain.exponentialRampToValueAtTime(.001,t0+3.9);b.connect(bg);bg.connect(out);b.start(t0);b.stop(t0+4);
    for(let k=0;k<8;k++){const t=t0+k*.5,f=ch[1+(k%4)]*2;const o=oc.createOscillator();o.type='triangle';o.frequency.value=f;const g=oc.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(out);o.start(t);o.stop(t+.5)}
    for(let k=0;k<8;k+=2){const t=t0+k*.5,o=oc.createOscillator();o.type='sine';o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);const g=oc.createGain();g.gain.setValueAtTime(.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g);g.connect(out);o.start(t);o.stop(t+.35)}
    for(let k=0;k<16;k++){const t=t0+k*.25,s=oc.createBufferSource();s.buffer=noise;const hp=oc.createBiquadFilter();hp.type='highpass';hp.frequency.value=6500;const g=oc.createGain();g.gain.setValueAtTime(k%2?.05:.1,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);s.connect(hp);hp.connect(g);g.connect(out);s.start(t);s.stop(t+.1)}
  });
  return oc.startRendering();
}
const Player={buf:null,kind:'demo',name:'Musica d\'esempio',playing:false,mode:'dry',vol:.3,node:null,dry:null,wet:null,mst:null,
  async prepare(kind,file){
    await Eng.ensureCtx();this.kind=kind;
    if(kind==='demo'){this.name='Musica d\'esempio';if(!this._demo||this._demoSr!==Eng.ctx.sampleRate){this._demo=await synthDemo(Eng.ctx.sampleRate);this._demoSr=Eng.ctx.sampleRate}this.buf=this._demo}
    else if(kind==='pink'){this.name='Rumore rosa';this.buf=Eng.pinkBuf()}
    else if(kind==='file'&&file){this.name=file.name.replace(/\.[^.]+$/,'');const ab=await file.arrayBuffer();this.buf=await new Promise((res,rej)=>Eng.ctx.decodeAudioData(ab,res,rej))}
  },
  async play(filters){
    await Eng.ensureCtx();if(!this.buf)await this.prepare('demo');this.stop(true);
    const c=Eng.ctx,src=c.createBufferSource();src.buffer=this.buf;src.loop=true;
    const dry=c.createGain(),wet=c.createGain(),mst=c.createGain(),mk=c.createGain();
    dry.gain.value=this.mode==='dry'?1:0;wet.gain.value=this.mode==='wet'?1:0;mst.gain.value=0;
    src.connect(dry);dry.connect(mst);
    let prev=src;const fl=(filters||[]);
    fl.forEach(f=>{const b=c.createBiquadFilter();b.type='peaking';b.frequency.value=f.f;b.gain.value=f.g;b.Q.value=f.q;prev.connect(b);prev=b});
    // volume pareggiato: compensa la perdita media così "prima" e "dopo" suonano ugualmente forti
    const avg=mean(F.filter(f=>f>=100&&f<=8000).map(f=>Math.pow(10,fl.reduce((s,x)=>s+bell(f,x),0)/10)));
    mk.gain.value=clamp(Math.pow(10,-dBp(avg)/20),.5,1.7);
    prev.connect(mk);mk.connect(wet);wet.connect(mst);mst.connect(c.destination);
    src.start();mst.gain.setTargetAtTime(this.vol,c.currentTime,.4);
    Object.assign(this,{node:src,dry,wet,mst,playing:true});
  },
  stop(quick){
    if(this.node){const n=this.node,m=this.mst,c=Eng.ctx;try{m.gain.setTargetAtTime(0,c.currentTime,.05);setTimeout(()=>{try{n.stop();n.disconnect()}catch(e){}},quick?80:250)}catch(e){}}
    this.node=null;this.playing=false;
  },
  setMode(m){this.mode=m;if(this.dry){const t=Eng.ctx.currentTime;this.dry.gain.setTargetAtTime(m==='dry'?1:0,t,.06);this.wet.gain.setTargetAtTime(m==='wet'?1:0,t,.06)}},
  setVol(v){this.vol=v;if(this.mst)this.mst.gain.setTargetAtTime(v,Eng.ctx.currentTime,.08)}
};

    return scr({nav:{title:'',right:helpBtn},cls:'pad',body:`${steps(2,4)}<div class="head" style="text-align:center"><h1 class="lt" id="lvT">Regola il volume</h1><p class="ls" id="lvS">${msg}</p></div>

  if(st==='pos')return scr({nav:{title:'',right:helpBtn},cls:'pad',body:`${steps(3,4)}<div class="head" style="text-align:center"><h1 class="lt">Dove misuriamo?</h1><p class="ls">${M.total} punti, ${Math.round(M.dur()/1000)} secondi ciascuno. Tieni il telefono all'altezza dell'orecchio, da seduto, rivolto verso le casse.</p></div>${mapSVG(0)}`,dock:btn('Inizia dal punto 1','data-a="mrun"')});
  if(st==='run')return scr({nav:{title:'Punto '+(M.i+1)+' di '+M.total,compact:true,back:false,right:`<button class="gbtn txt" data-a="mgo" data-s="pos">Annulla</button>`},cls:'pad',body:`<div class="head" style="text-align:center"><div class="t-cap">Punto ${M.i+1} di ${M.total}</div><h1 class="lt" style="margin-top:8px">${PT_NAMES[M.i]}</h1></div>

    return scr({nav:{title:'Punto '+M.i+' di '+M.total,compact:true,back:false},cls:'pad',body:`<div class="vsl center" style="gap:16px"><div class="checkseal">${ic('check',38,3)}</div><h1 class="lt" style="text-align:center">Punto ${M.i} salvato</h1></div>${mapSVG(last?undefined:M.i)}
      ${q&&q.clip?banner('bad','alert','<b>Il microfono è andato in saturazione.</b> Abbassa il volume e ripeti il punto.'):q&&q.snr!=null&&q.snr<6?banner('bad','alert','<b>Si sente poco il rumore sopra il fondo.</b> Alza un po\' il volume e ripeti il punto.'):''}
      <p class="t-body" style="text-align:center">${last?'Hai finito. Ora analizziamo.':'Prossimo: <b>'+PT_NAMES[M.i]+'</b>.'}</p>`,dock:`${btn(last?'Analizza la sala':'Misura il punto '+(M.i+1),'data-a="mnext"')}${btn('Ripeti questo punto','data-a="mrepeat"','plain')}`})}
  if(st==='ana')return scr({nav:{title:'',back:false},cls:'pad',body:`<div class="head" style="text-align:center;margin-top:30px"><h1 class="lt">Stiamo leggendo la sala</h1></div>
      <div class="list" id="anaList">${['Media dei punti','Confronto con l\'obiettivo','Calcolo della correzione'].map((t,i)=>`<div class="row" id="ana${i}" style="opacity:.35"><span class="step-dot" style="width:24px;display:grid;place-items:center">${ic('check',20,2.6)}</span><div class="rt"><b>${t}</b></div></div>`).join('')}</div>`});
  return '';
},after:()=>{
  const st=M.stage;
  if(st==='floorrun')runMeasure();
  if(st==='floordone')later(()=>{M.stage='level';R.dir='fade';render()},1000);
  if(st==='level')levelLoop();
  if(st==='run')runMeasure();
  if(st==='ana'){[0,1,2].forEach(i=>later(()=>{const e=$('#ana'+i);if(e){e.style.opacity=1;e.querySelector('.step-dot').style.color='var(--tint-text)'}},300+i*500));later(finishAnalysis,1900)}
}};

ACT.mgo=d=>{if(Eng.noiseOn&&d.s!=='level'&&d.s!=='pos')Eng.stopNoise();M.stage=d.s;R.dir='fade';render();window.scrollTo(0,0)};
ACT.mmic=async()=>{

  catch(e){const n=e&&e.name,m=e&&e.message;
    M.err=m==='insecure'?'Il microfono funziona solo da una pagina sicura (https). Apri Accordo dall\'indirizzo https o dall\'icona installata.':n==='NotAllowedError'||n==='SecurityError'?'Il microfono è bloccato. Su iPhone: Impostazioni › Apps › Safari › Microfono, oppure tocca «aA» nella barra e scegli Impostazioni sito web.':n==='NotFoundError'?'Non troviamo un microfono su questo dispositivo.':'Non riusciamo ad aprire il microfono ('+esc(n||m||'errore')+').';
    M.stage='perm';R.dir='none';render()}
};
ACT.mfloor=()=>{M.stage='floorrun';R.dir='fade';render()};
ACT.mrun=()=>{M.i=0;M.stage='run';R.dir='push';render();window.scrollTo(0,0)};
ACT.mnext=()=>{if(M.i<M.total){M.stage='run';R.dir='fade';render();window.scrollTo(0,0)}else{Eng.stopNoise();M.stage='ana';R.dir='fade';render()}};
ACT.mrepeat=()=>{M.i=Math.max(0,M.i-1);M.pts.pop();M.stage='run';R.dir='fade';render()};
function levelLoop(){
  if(M.src==='cable'&&!Eng.noiseOn){M.vol=.06;Eng.startNoise(M.vol).catch(()=>{})}
  let ok=0,t0=performance.now();
  tmr(()=>{
    if(!Eng.ready())return;const bp=Eng.bandPow(),l=Eng.level();paintSpec(bp);
    const snr=M.floor?mean(MID.map(i=>dBp(bp[i])-dBp(M.floor.pow[i]))):14,clip=l.peak>.95;M.snr=snr;
    if(M.src==='cable'&&Eng.noiseOn){if(clip)M.vol=Math.max(.03,M.vol-.05);else if(snr<14&&M.vol<.7)M.vol=Math.min(.7,M.vol+.02);else if(snr>28)M.vol=Math.max(.03,M.vol-.02);Eng.setNoise(M.vol)}
    const g=$('#gpos');if(g)g.style.left=clamp(snr/36*100,0,100)+'%';
    const good=snr>=10&&snr<=28&&!clip,low=snr<10,pl=$('#lvPill');
    if(pl)pl.innerHTML=good?pill('good','Perfetto'):clip||snr>28?pill('bad','Troppo forte'):pill('','Troppo piano');
    ok=good?ok+1:0;
    const hint=$('#lvHint');if(hint&&performance.now()-t0>12000&&!good)hint.innerHTML=banner('bad','alert',low?'<b>Non sentiamo abbastanza rumore.</b> Controlla il cavo, il canale e i fader del mixer, e il volume del telefono.':'<b>Il suono è troppo forte per il microfono.</b> Abbassa il fader.');
    else if(hint&&good)hint.innerHTML='';
    if(ok>=14){M.stage='pos';R.dir='fade';render();window.scrollTo(0,0)}
  },120);
}
async function runMeasure(){
  const floorRun=M.stage==='floorrun',ms=floorRun?(FAST?1000:5000):M.dur(),tot=Math.round(ms/1000),circ=floorRun?2*Math.PI*84:2*Math.PI*89;
  const r=await measure(ms,(bp,fr,l)=>{paintSpec(bp);const rn=$('#rn');if(rn)rn.textContent=Math.max(0,Math.ceil(tot*(1-fr)));const rg=$('.ringg .rg');if(rg)rg.style.strokeDashoffset=(+rg.dataset.c*(1-fr)).toFixed(1)});
  if(!r)return;
  if(floorRun){M.floor=r;M.floorDb=Math.round(20*Math.log10(Math.max(r.rms,1e-6)));M.stage='floordone';R.dir='fade';render();return}
  M.pts.push(r);M.i++;const snr=M.floor?mean(MID.map(i=>dBp(r.pow[i])-dBp(M.floor.pow[i]))):null;
  M.qc={snr,clip:r.peak>.98};M.stage='between';R.dir='fade';render();window.scrollTo(0,0);
}
function finishAnalysis(){
  Eng.stopNoise();
  const q=DB.q,ref=M.ref(),tier=q.extmic?'alta':'base',opt={obj:q.obj,ref:ref==='musica'?'musica':'pink',tier,V:DB.qDone?rt60(q).V:undefined};
  const a=analyze(M.pts,M.floor,opt),pl=planEq(a,opt);
  if(M.after&&DB.cur){const e=DB.hist.find(h=>h.id===DB.cur);
    if(e){e.after={D:a.D.map(v=>+v.toFixed(2)),score:pl.score0,t:Date.now()};save();go('cmp',{id:e.id},{replace:true,dir:'fade'});return}}
  const e={id:Date.now(),t:Date.now(),score:pl.score0,scoreAfter:pl.score1,D:a.D.map(v=>+v.toFixed(2)),P:pl.P.map(v=>+v.toFixed(2)),SP:a.SP.map(v=>+v.toFixed(1)),T:a.T.map(v=>+v.toFixed(2)),valid:a.valid,cov:a.cov.map(v=>+v.toFixed(1)),clar:+pl.clar.toFixed(1),
    filters:pl.filters,varia:pl.varia,dips:pl.dips,lf:pl.lf,tier,ref:opt.ref,src:M.src,npts:a.npts,obj:q.obj,q:JSON.parse(JSON.stringify(q)),prog:{}};
  DB.hist.unshift(e);DB.hist=DB.hist.slice(0,30);DB.cur=e.id;M.res=e;save();R.stack=[];go('res',{id:e.id},{replace:true,dir:'fade'});
}

  if(cs>6)issues.push('Il suono non è uguale in tutta la sala.');

  if(clar)rows.push(row({tile:'person',tc:'gray',t:'Consonanti deboli',s:'2–4 kHz sotto il livello giusto. Si risolve sul canale di chi predica.',right:pill('ac','Chiarezza')}));

  if(e.lf.length)rows.push(row({tile:'speaker',tc:'gray',t:'Bassi sotto 100 Hz',s:'Più forti del previsto. Il telefono lì è meno preciso.',right:pill('','Indicativo')}));
  if(e.varia.length)rows.push(row({tile:'group',tc:'gray',t:'Cambia da posto a posto',s:e.varia.map(v=>hz(v.f)).join(', ')+'. Non si risolve con l\'EQ.'}));

    <div class="card tight"><div style="display:flex;justify-content:space-between;align-items:center"><div class="t-head">Come risponde la sala</div><button class="gbtn" style="min-width:36px;height:36px;padding:0" data-a="chartHelp" aria-label="Come leggere il grafico">${ic('help',18,2)}</button></div><p class="t-foot" style="margin-bottom:12px">Lo zero è dove vorresti essere. Tocca il grafico per i valori.</p>${chart({T:e.T,SP:e.SP,spread:1,marks:e.filters.map(f=>({f:f.f,l:f.name})),ser:[{n:'Misurata',v:e.D,c:'var(--l1)'}]})}${e.tier==='base'?`<p class="t-foot" style="margin-top:10px">Misura col telefono: affidabile da circa 100 Hz a 8 kHz. Fuori da lì il tratteggio è indicativo.</p>`:''}</div>
    ${e.ref==='musica'?banner('info','info','Misura senza rumore rosa: il confronto è con uno spettro medio tipico, quindi meno preciso.'):''}
    ${e.valid.filter(v=>!v).length>5?banner('bad','alert','Diverse zone sono coperte dal rumore di fondo. Alza il volume del rumore rosa o ripeti in silenzio.'):''}

    dock:top.length&&hasEq?`${btn(ic('vol',20,2)+'Ascolta la differenza','data-a="go" data-v="listen"')}${btn('Come sistemarlo','data-a="go" data-v="plan"','tinted')}`:fix?btn('Come sistemarlo','data-a="go" data-v="plan"'):btn('Fine','data-a="go" data-v="home"')})}};

function roLoop(){
  tmr(()=>{
    if(!Eng.ready())return;Eng.an.getFloatFrequencyData(Eng.fbuf);const fb=Eng.fbuf,bh=Eng.binHz,k0=Math.round(150/bh),k1=Math.round(10000/bh);
    let pk=-1e9,pi=0;for(let k=k0;k<k1;k++)if(fb[k]>pk){pk=fb[k];pi=k}
    let sum=0,c=0;for(let k=Math.max(k0,pi-40);k<Math.min(k1,pi+40);k++)if(Math.abs(k-pi)>3){sum+=Math.pow(10,fb[k]/10);c++}
    const around=dBp(sum/Math.max(c,1)),prom=pk-around,f=pi*bh;
    paintSpec(Eng.bandPow(),F.findIndex(fc=>f>=fc*Math.pow(2,-1/6)&&f<fc*Math.pow(2,1/6)));
    RO.hist.push({f,prom,pk});if(RO.hist.length>10)RO.hist.shift();
    const stable=RO.hist.length>=8&&RO.hist.every(h=>h.prom>14&&Math.abs(h.f-f)/f<.03&&h.pk>-85);
    const fe=$('#roF'),pe=$('#roP');
    if(stable){RO.cand=Math.round(f/(f<1000?5:25))*(f<1000?5:25);if(fe)fe.textContent=hz(RO.cand);if(pe)pe.innerHTML=pill('bad','Fischia');
      $('#roCut').innerHTML=`<div class="big3"><div><div class="lab">Frequenza</div><b>${RO.cand>=1000?(RO.cand/1000).toString().replace('.',',')+'k':RO.cand}</b><small>Hz</small></div><div><div class="lab">Taglio</div><b>−6</b><small>dB</small></div><div><div class="lab">Q</div><b>8</b><small>stretta</small></div></div><div style="margin-top:14px">${btn('Ho tagliato questa frequenza','data-a="roAdd"','tinted')}</div>`}
    else{RO.cand=null;if(fe)fe.textContent='—';if(pe)pe.innerHTML=pill('','In ascolto');const c2=$('#roCut');if(c2)c2.innerHTML=''}
  },120);
}

/* ---- scheda ---- */
function sheetText(e){
  const q=e.q,L=[];L.push(`Accordo · ${DB.set.name||'La mia chiesa'}${DB.set.sala?' · '+DB.set.sala:''}`);L.push(new Date(e.t).toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'}));
  L.push(`Punteggio: ${e.score}/100${e.after?' → '+e.after.score+'/100':''}`);L.push('');
  if(q.eqM!=='none'){L.push('EQ MASTER');e.filters.forEach(f=>L.push(`• ${hz(f.f)}  ${nf(f.g)} dB  Q ${String(f.q).replace('.',',')}  (${f.name})`));if(!e.filters.length)L.push('• nessuna correzione')}
  if(e.ringList&&e.ringList.length){L.push('');L.push('RING-OUT');e.ringList.forEach(f=>L.push(`• ${hz(f)}  −6 dB  Q 8`))}
  if(DB.qDone){L.push('');L.push('CANALI');sourcesFromQ(q).forEach(id=>{const r=REC[id];L.push(`• ${r.n}: ${r.hpf?'taglia i bassi a '+r.hpf+' Hz':'—'}${r.cuts[0]?'; '+nf(r.cuts[0][1])+' dB a '+hz(r.cuts[0][0]):''}`)})}
  return L.join('\n');
}

  },100)}};

const MICP=[
 {id:'headset',t:'Headset',s:'All\'angolo della bocca',steps:['La capsula all\'angolo della bocca, a 1–2 cm, mai davanti alle labbra: si sentono i soffi.','L\'archetto deve stare fermo: la distanza non cambia, quindi il volume resta costante.','Il cavo sotto il vestito, con un po\' di gioco.','Dopo ogni cambio di persona, controlla di nuovo la capsula.']},
 {id:'lavalier',t:'Lavalier',s:'Al centro dello sterno',steps:['Al centro dello sterno, circa 15–20 cm sotto la bocca.','Non troppo vicino alla gola: la voce suona gonfia.','Tessuto teso, senza collane, barba o pieghe che strusciano.','Fissa bene il cavo: ogni fruscio si sente in sala.','È il più lontano dalla bocca: fai bene il ring-out.']},
 {id:'palmare',t:'Palmare',s:'A due dita dalla bocca',steps:['A 2–5 cm dalla bocca, circa due dita.','Non coprire la rete con la mano: fa fischiare.','Mantieni la stessa distanza: avvicinare alza il volume.','Non puntarlo verso le casse o i monitor.']},
 {id:'coro',t:'Coro',s:'Sopra le teste, lontano dalle casse',steps:['Microfoni direzionali sopra le teste del coro, a circa 1,5–2 m.','Regola dei tre a uno: ogni microfono dista dal vicino almeno tre volte la distanza dalla sua fonte.','Non vicino alle casse: il coro è il microfono che fischia di più.','Meno microfoni è meglio: due o tre bastano.']},
 {id:'agtr',t:'Chitarra acustica',s:'Meglio diretta',steps:['Se ha il cavo diretto (DI), usalo: è più sicuro.','Se ci vuole il microfono, a 15–20 cm verso il dodicesimo tasto.','Non davanti alla buca: il suono diventa gonfio.']},
 {id:'egtr',t:'Chitarra elettrica',s:'Sul cono dell\'ampli',steps:['Microfono dinamico a 2–5 cm dal cono, un poco fuori centro.','Ampli rialzato da terra e inclinato verso l\'orecchio di chi suona.','Meglio tenere il volume dell\'ampli basso e far fare al mixer il resto.']},
 {id:'keys',t:'Tastiera e basso',s:'Sempre diretti',steps:['Cavo diretto (DI) al mixer: nessun microfono.','Il suono resta pulito e non entra negli altri microfoni.','Ricorda il filtro dei bassi sulla tastiera, ma non sul basso.']},
 {id:'batteria',t:'Batteria',s:'Meno microfoni di quanto pensi',steps:['In sala piccola bastano grancassa e un microfono sopra.','Il microfono sopra, circa un metro, rivolto verso piatti e rullante.','Con uno schermo davanti, il suono in sala diminuisce.','Prima di mettere più microfoni, prova ad abbassare chi suona.']}
];
const MOM=[
 {id:'accoglienza',t:'Accoglienza',s:'Musica bassa, microfoni chiusi',steps:['Musica più bassa di una conversazione.','Microfoni spenti, tranne chi accoglie.','Controlla le batterie e fai il ring-out di chi predica.','Siediti in un posto del pubblico e ascolta.']},
 {id:'lode',t:'Lode cantata',s:'Voci sopra gli strumenti',steps:['Le voci devono stare sopra gli strumenti: la gente canta con loro.','La batteria parte piano.','Non usare le scene salvate: il culto è spontaneo, tieni i fader a mano.','Resta sotto circa 90 dB(A): più forte e la gente smette di cantare.','Abbassa gli strumenti, non alzare tutto.']},
 {id:'preghiera',t:'Preghiera di tutti',s:'Tanti microfoni aperti',steps:['Abbassa il master di circa 3 dB.','Chiudi tutti i microfoni tranne chi guida.','Musica sotto la voce, non sopra.','Non cercare di coprire la preghiera spontanea: lascia che si senta.']},
 {id:'lettura',t:'Lettura della Parola',s:'Voce chiara e vicina',steps:['Microfono del leggio o palmare: ricorda il ring-out.','Chiedi di avvicinarsi al microfono.','Controlla che si capisca anche in fondo.']},
 {id:'predicazione',t:'Predicazione',s:'La parola prima di tutto',steps:['Headset o lavalier: la distanza dalla bocca non cambia.','Il volume della lode non deve partire più forte della parola.','Solo il fader di chi parla: non toccare il gain.','Parola tra 70 e 80 dB(A) in sala.','Spegni ventilatori e aria condizionata.']},
 {id:'appello',t:'Appello e ministero all\'altare',s:'Il momento dei fischi',steps:['Un solo palmare aperto alla volta, con il fader basso.','Mano sul master pronta ad abbassarlo.','Musica sotto la voce.','Chi prega al microfono lo tenga vicino alla bocca e lontano dalle casse.']},
 {id:'testimonianze',t:'Testimonianze',s:'Il palmare passa di mano',steps:['Fader basso, lo alzi solo quando parla.','Chiedi di tenerlo a due dita dalla bocca.','Dopo il ring-out non toccare il gain: muovi solo il fader.','Se è timido o anziano, lascia il microfono più vicino.']},
 {id:'annunci',t:'Annunci e offerte',s:'Parola e musica leggera',steps:['Voce chiara, musica di sottofondo molto bassa.','Controlla che si capisca anche in fondo.','Tieni pronto il microfono jolly.']},
 {id:'speciali',t:'Eventi speciali',s:'Matrimoni, funerali, conferenze',steps:['Prova i microfoni il giorno prima, con la sala vuota.','Controlla le batterie e porta microfoni in più.','Chiedi il programma: chi parla, quanti microfoni, la musica.','Controlla interferenze sui microfoni radio.']}
];
const DOCS={acu:ACU,mic:MICP,mom:MOM};
const DLIST={acu:['Acustica a basso costo','Dal gratuito al più utile. Cosa fare, come, quanto costa.'],mic:['Posizionare i microfoni','Dove mettere ogni microfono, e a che distanza.'],mom:['Momenti del culto','Cosa tenere d\'occhio in ogni momento.']};

/* ---------- libreria (con ricerca) ---------- */
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function searchIndex(){
  const I=[];
  SOS.forEach(s=>I.push({k:'sosd',id:s.id,t:s.t,s:'Aiuto al volo',i:s.i,kw:s.t+' '+s.s+' '+s.steps.join(' ')+(s.id==='fischio'?' larsen feedback ritorno acufene':'')}));
  LES.forEach((l,i)=>I.push({k:'lesd',id:i,t:l.t,s:'Lezione',i:'school',kw:l.t+' '+l.s+' '+l.p.join(' ')}));
  ACU.forEach(a=>I.push({k:'doc',src:'acu',id:a.id,t:a.t,s:'Acustica · '+a.cost,i:'cube',kw:a.t+' '+a.s+' '+a.steps.join(' ')}));
  MICP.forEach(a=>I.push({k:'doc',src:'mic',id:a.id,t:a.t,s:'Microfono',i:'mic',kw:a.t+' '+a.s+' '+a.steps.join(' ')}));
  MOM.forEach(a=>I.push({k:'doc',src:'mom',id:a.id,t:a.t,s:'Momento del culto',i:'group',kw:a.t+' '+a.s+' '+a.steps.join(' ')}));
  EAR.forEach(e=>I.push({k:'earn',id:e.id,t:e.t,s:'Impara a sentire',i:'wave',kw:e.t+' '+e.hear+' '+e.fix}));
  Object.keys(REC).forEach(id=>I.push({k:'recipe',id,t:REC[id].n,s:'Ricetta',i:REC[id].ic,kw:REC[id].n+' '+(REC[id].note||'')}));
  GL.forEach((g,i)=>I.push({k:'gl',id:i,t:g[0],s:'Glossario',i:'book',kw:g[0]+' '+g[1]+' '+g[2]}));
  return I;
}
function runSearch(q){
  const w=norm(q).split(/\s+/).filter(Boolean);if(!w.length)return[];
  return searchIndex().map(x=>{const h=norm(x.t),k=norm(x.kw);let sc=0;for(const t of w){if(h.includes(t))sc+=3;else if(k.includes(t))sc+=1;else return null}return{...x,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,12);
}
ACT.sres=d=>{const k=d.k;if(k==='sosd')go('sosd',{id:d.id});else if(k==='lesd')go('lesd',{i:+d.id});else if(k==='doc')go('doc',{src:d.src,id:d.id});else if(k==='earn')go('earn',{id:d.id});else if(k==='recipe')recipeSheet(d.id);else if(k==='gl')ACT.gl({i:d.id})};
VIEWS.lib={html:()=>{
  const g=(h,rows)=>list(rows,h,'','ic');
  return scr({nav:{title:'Libreria'},lt:'Libreria',ls:'Tutto quello che serve, quando serve.',
   body:`<input class="input" id="sIn" type="search" placeholder="Cerca: fischio, tende, microfono…" autocomplete="off" inputmode="search" aria-label="Cerca nella libreria"><div id="sRes"></div>
   <div id="libMain" class="vsl" style="gap:24px">
   ${g('Impara',[row({tile:'school',t:'Lezioni da 5 minuti',s:'Un concetto per volta',a:'data-a="go" data-v="les"',chev:1}),row({tile:'wave',t:'Impara a sentire',s:'Ascolta come suona ogni problema',a:'data-a="go" data-v="earl"',chev:1}),row({tile:'book',t:'Glossario',s:'Le parole, spiegate semplici',a:'data-a="go" data-v="gloss"',chev:1})])}
   ${g('In pratica',[row({tile:'group',t:'Momenti del culto',s:'Lode, preghiera, predicazione, ministero',a:'data-a="dlist" data-src="mom"',chev:1}),row({tile:'mic',t:'Posizionare i microfoni',s:'Dove, e a che distanza',a:'data-a="dlist" data-src="mic"',chev:1}),row({tile:'sliders',t:'Ricette per strumento',s:'Valori di partenza',a:'data-a="go" data-v="rec"',chev:1}),row({tile:'help',t:'Dove trovo l\'EQ?',s:'Per tipo di mixer',a:'data-a="go" data-v="mixh"',chev:1})])}
   ${g('Acustica',[row({tile:'cube',t:'Acustica a basso costo',s:'Tende, pannelli, casse: cosa fare e quanto costa',a:'data-a="dlist" data-src="acu"',chev:1})])}
   ${g('Strumenti',[row({tile:'wave',t:'Test dell\'eco',s:DB.rt?'Riverbero '+DB.rt.t.toFixed(1).replace('.',',')+' s':'Misura il riverbero con le mani',a:'data-a="go" data-v="eco"',chev:1}),row({tile:'mic',t:'Ring-out del microfono',s:'Trova il fischio',a:'data-a="go" data-v="ring"',chev:1}),row({tile:'vol',t:'Volume della sala',s:'Lode e parola a confronto',a:'data-a="go" data-v="vol"',chev:1}),row({tile:'speaker',t:'Prova il microfono',s:'Spettro in tempo reale',a:'data-a="go" data-v="diag"',chev:1})])}
   </div>`})},
 after:()=>{const i=$('#sIn');if(!i)return;i.addEventListener('input',()=>{const q=i.value.trim(),main=$('#libMain'),res=$('#sRes');if(!q){res.innerHTML='';main.style.display='';return}
   main.style.display='none';const r=runSearch(q);res.innerHTML=r.length?list(r.map(x=>row({tile:x.i,tc:'gray',t:x.t,s:x.s,a:`data-a="sres" data-k="${x.k}" data-id="${x.id}" ${x.src?`data-src="${x.src}"`:''}`,chev:1})),'Risultati','','ic'):`<p class="t-body sec" style="padding:8px 4px">Niente per «${esc(q)}». Prova con un\'altra parola, per esempio «fischio» o «tende».</p>`})}};

/* ---------- prossimo passo e percorso ---------- */
function cultoSoon(){const d=DB.set.days||[0],dow=new Date().getDay();return d.includes(dow)?'oggi':d.includes((dow+1)%7)?'domani':null}
function nextStep(){
  const e=DB.hist[0],items=checkItems(),dn=chkDone(),nd=items.filter(i=>dn[i.id]).length,soon=cultoSoon(),eq=e&&(e.q||DB.q).eqM!=='none';
  if(soon&&e&&nd<items.length)return{t:soon==='oggi'?'Il culto è oggi':'Il culto è domani',s:nd?`Hai fatto ${nd} di ${items.length} controlli.`:'Quindici minuti di controllo prima del culto.',b:'Prima del culto',a:'data-a="go" data-v="check"',i:'check'};
  if(!e)return{t:'Misura la sala',s:'Tre minuti con il telefono: poi senti la differenza.',b:'Inizia',a:'data-a="start"',i:'wave'};
  if(!e.after&&e.filters.length&&eq&&!e.listened)return{t:'Ascolta la differenza',s:'Senti come suonerebbe con la correzione.',b:'Ascolta',a:'data-a="homeListen"',i:'vol'};
  if(!e.after&&e.filters.length&&!(e.prog&&e.prog.eq))return{t:'Sistemalo sul mixer',s:'Una banda alla volta, nell\'ordine giusto.',b:'Comincia',a:'data-a="homePlan"',i:'sliders'};
  if(!e.after&&e.filters.length)return{t:'Controlla il risultato',s:'Rimisura gli stessi punti e vedi la differenza.',b:'Rimisura',a:'data-a="remeasure"',i:'refresh'};
  if(!DB.rt)return{t:'Misura il riverbero',s:'L\'equalizzatore non lo risolve: sapere quanto è lungo aiuta.',b:'Test dell\'eco',a:'data-a="go" data-v="eco"',i:'wave'};
  if(!DB.qDone)return{t:'Racconta la sala',s:'Due minuti: poi i consigli sono su misura.',b:'Racconta',a:'data-a="roomStart"',i:'bulb'};
  const wk=Math.floor(Date.now()/604800000)%LES.length;return{t:'Lezione della settimana',s:LES[wk].t,b:'Leggi',a:`data-a="lesd" data-i="${wk}"`,i:'school'};
}
function pathTracker(e){
  const done=[true,!!(e.listened||e.after||(e.q||DB.q).eqM==='none'),!!(e.prog&&e.prog.eq)||!!e.after||!e.filters.length,!!e.after];
  const cur=done.findIndex(v=>!v);
  return `<div class="path" role="img" aria-label="Il tuo percorso">${['Misura','Ascolta','Sistema','Verifica'].map((l,i)=>`<div class="${done[i]?'done':i===cur?'cur':''}"><i>${done[i]?ic('check',15,3):`<b style="font:700 13px var(--round)">${i+1}</b>`}</i>${l}</div>`).join('')}</div>`;
}
ACT.homePlan=()=>{DB.cur=DB.hist[0].id;save();go('plan')};

/* ---- home ---- */
VIEWS.home={html:()=>{
  const last=DB.hist[0],sc=last?(last.after?last.after.score:last.score):0,lab=last?scoreLabel(sc):null,ns=nextStep();
  const next=`<div class="card hero"><div style="display:flex;gap:16px;align-items:center">${last?scoreRing(sc,88):`<span class="tile lg">${ic(ns.i,22,2)}</span>`}<div style="flex:1;min-width:0"><div class="t-cap">${last?'Ultima taratura · '+new Date(last.t).toLocaleDateString('it-IT',{day:'numeric',month:'short'}):'Per cominciare'}</div><div class="t-title2" style="margin:6px 0 4px">${last?lab[0]:ns.t}</div>${last&&last.after?`<p class="t-sub">Da ${last.score} a ${last.after.score}.</p>`:''}</div></div>
    ${last?pathTracker(last):''}
    <div class="vsl" style="gap:6px;margin-top:${last?'18px':'16px'}"><div>${last?`<div class="t-head" style="font-weight:600">Prossimo passo: ${ns.t}</div>`:''}<p class="t-sub" style="margin-top:2px">${ns.s}</p></div><div style="height:6px"></div>${btn(ns.b,ns.a)}${last?`<button class="btn plain" data-a="start">Nuova taratura</button>`:''}</div></div>`;
  const items=checkItems(),dn=chkDone(),nd=items.filter(i=>dn[i.id]).length,soon=cultoSoon();
  const week=[row({tile:'check',t:'Prima del culto',s:nd?`${nd} di ${items.length} fatte oggi`:soon?(soon==='oggi'?'Il culto è oggi':'Il culto è domani'):'Il controllo in 15 minuti',a:'data-a="go" data-v="check"',chev:1}),row({tile:'help',t:'Aiuto al volo',s:'Qualcosa non va? Cosa fare, passo per passo',a:'data-a="go" data-v="sos"',chev:1}),row({tile:'vol',t:'Volume della sala',s:'La lode non deve coprire la parola',a:'data-a="go" data-v="vol"',chev:1})];
  const more=[row({tile:'book',t:'Libreria',s:'Lezioni, suoni, acustica, microfoni, ricette',a:'data-a="go" data-v="lib"',chev:1}),...(DB.hist.length?[row({tile:'clock',t:'Storico',val:DB.hist.length,a:'data-a="go" data-v="hist"',chev:1})]:[])];
  return scr({nav:{back:false,right:gb('gear','go','Impostazioni','data-v="set"')},lt:esc(DB.set.name||'Accordo'),ls:DB.set.sala?esc(DB.set.sala):'La tua sala, accordata.',body:next+list(week,'Per il culto','','ic')+list(more,'','','ic')})}};
