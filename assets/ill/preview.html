<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Illustrazioni · anteprima</title>
<style>
  :root{--bg:#F2F2F7;--cell:#fff;--l1:#000;--l2:rgba(60,60,67,.62)}
  @media (prefers-color-scheme:dark){:root{--bg:#000;--cell:#1C1C1E;--l1:#fff;--l2:rgba(235,235,245,.62)}}
  body{margin:0;background:var(--bg);color:var(--l1);font:15px/1.4 -apple-system,system-ui,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:24px 16px 60px}
  h1{font-size:28px;margin:0 0 4px} p.s{color:var(--l2);margin:0 0 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}
  figure{margin:0}
  .ill{border-radius:24px;overflow:hidden;background:var(--cell);box-shadow:inset 0 0 0 .5px rgba(128,128,128,.3);width:358px;max-width:100%}
  .ill img{display:block;width:100%;height:100%;object-fit:cover}
  .ill.miss{display:grid;place-items:center;color:var(--l2);border:1.5px dashed rgba(128,128,128,.5);background:none;box-shadow:none}
  figcaption{margin-top:8px;color:var(--l2);font-size:13px} figcaption b{color:var(--l1);font-size:15px}
  .bad{color:#d33}
</style>
</head>
<body>
<main>
  <h1>Illustrazioni</h1>
  <p class="s">Come compaiono nell'app: scheda larga 358 px (iPhone), angolo 24. Per aprire questa pagina: <code>python3 -m http.server</code> nella cartella principale, poi <code>/assets/ill/preview.html</code>.</p>
  <div class="grid" id="g"></div>
</main>
<script>
fetch('manifest.json').then(r=>r.json()).then(m=>{
  const g=document.getElementById('g');
  m.images.forEach(im=>{
    const f=document.createElement('figure'),box=document.createElement('div');
    box.className='ill';box.style.aspectRatio=im.w+' / '+im.h;
    const cap=document.createElement('figcaption');
    cap.innerHTML='<b>'+im.name+'</b><br>'+im.screen+' · '+im.w+'×'+im.h+'<br><span class="meta">…</span>';
    const img=new Image();
    img.onload=()=>{
      box.append(img);
      const ok=img.naturalWidth===im.w&&img.naturalHeight===im.h;
      fetch(img.src).then(r=>r.blob()).then(b=>{const kb=Math.round(b.size/1024);
        cap.querySelector('.meta').innerHTML=(ok?'':'<span class="bad">dimensioni '+img.naturalWidth+'×'+img.naturalHeight+' · </span>')+kb+' KB'+(kb>m.maxKB?' <span class="bad">troppo pesante</span>':'')});
    };
    img.onerror=()=>{box.classList.add('miss');box.textContent='manca '+im.name+'.webp';cap.querySelector('.meta').textContent='';};
    img.src=im.name+'.webp';
    f.append(box,cap);g.append(f);
  });
});
</script>
</body>
</html>
